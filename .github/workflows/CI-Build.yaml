name: (Choose Branch) Build and Push Branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '選擇部署分支'
        required: true
        type: choice
        options:
          - stg
          - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Show which branch running...
        run: echo "目前在跑的分支 ${{ inputs.branch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登入 GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/engine/Dockerfile
          push: true
          # ghcr.io/Jefflin0225/stg:sep-engine:abc123
          # ghcr.io/Jefflin0225/main:sep-engine:abc123
          tags: ghcr.io/jefflin0225/${{ inputs.branch }}/sep-engine:${{ github.sha }}
