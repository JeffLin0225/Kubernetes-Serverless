global:
  namespace: ns-sep-dev

quotas:
  systems:
    # dev 環境把 crawler 資源調小
    crawler:
      cpu_request: "100m"
      memory_request: "128Mi"
      cpu_limit: "250m"
      memory_limit: "256Mi"

engine:
  replicas: 1
  # ── dev 覆寫 env（只寫跟預設不同的） ──
  env:
    LOG_LEVEL: "debug"         # dev 才開 debug
    GIN_MODE: "debug"

cleaner:
  env:
    LOG_LEVEL: "debug"
    SCAN_INTERVAL: "5s"        # dev 掃快一點方便測試
