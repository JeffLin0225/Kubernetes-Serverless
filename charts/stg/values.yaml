global:
  namespace: ns-sep-stg

quotas:
  systems:
    crawler:
      cpu_request: "100m"
      memory_request: "128Mi"
      cpu_limit: "250m"
      memory_limit: "256Mi"

engine:
  replicas: 1
  port: 8080
  service:
    type: ClusterIP
  image:
    repository: sep-engine
    tag: stg
    pullPolicy: Never
  resource:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

cleaner:
  replicas: 1
  image:
    repository: sep-cleaner
    tag: stg
    pullPolicy: Never
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"