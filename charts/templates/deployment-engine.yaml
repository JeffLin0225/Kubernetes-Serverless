apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-engine
  namespace: {{ .Values.global.namespace }}
  labels:
    app: {{ .Chart.Name }}-engine
  annotations:
    # ConfigMap 內容變動時自動觸發滾動重啟（不需要手動 kubectl rollout restart）
    checksum/config: {{ include (print $.Template.BasePath "/configmap-engine.yaml") . | sha256sum }}

spec:
  replicas: {{ .Values.engine.replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}-engine
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}-engine
    spec:
      serviceAccountName: {{ .Chart.Name }}-sa # RBAC
      containers:
        - name: engine
          image: "{{ .Values.engine.image.repository}}:{{ .Values.engine.image.tag }}"
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.engine.port }}

          # ── 環境變數注入（大規模做法）──────────────────
          # 1. 非機密 config（由 Helm 管的 ConfigMap）
          envFrom:
            - configMapRef:
                name: {{ .Chart.Name }}-engine-cm
          # 2. 機密值（由 SP 手動建立的 Secret，enabled 才掛）
          {{- if .Values.engine.secret.enabled }}
            - secretRef:
                name: {{ .Values.engine.secret.name }}
          {{- end }}

          # ── 資源限制 ────────────────────────────────────
          resources:
            {{- toYaml .Values.engine.resource | nindent 12 }}
