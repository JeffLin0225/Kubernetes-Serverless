# ========================================
# 1. 預設全域設定
# ========================================
global:
  namespace: ns-sep

# ========================================
# 2. 幫來源系統配額  (Quotas for ConfigMap)
# 後續會被轉成 sep-system-quotas ConfigMap
# ========================================
quotas:
  configMapName: sep-system-quotas
  systems:
    # 爬蟲系統
    crawler:
      cpu_request: "250m"
      memory_request: "512Mi"
      cpu_limit: "500m"
      memory_limit: "1Gi"
    # 報表系統
    reporting:
      cpu_request: "1000m"
      memory_request: "2Gi"
      cpu_limit: "2000m"
      memory_limit: "4Gi"
    # 資料分析系統
    analytics:
      cpu_request: "2000m"
      memory_request: "4Gi"
      cpu_limit: "4000m"
      memory_limit: "8Gi"

# ========================================
#  3. SEP Engine 微服務配置
# ========================================
engine:
  replicas: 1
  port: 8080
  image:
    repository: sep-engine
    tag: latest
    pullPolicy: Never
  resource:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # ----------------------------------------
  # 非機密業務參數（可進 git）
  # 機密值（DB_PASSWORD / JWT_SECRET）請用 K8s Secret
  # ----------------------------------------
  env:
    LOG_LEVEL: "info"
    JOB_TIMEOUT: "30s"
    MAX_RETRY: "3"
    GIN_MODE: "release"
  # ----------------------------------------
  # 是否掛載 Secret（由 SP 人員手動建立）
  # ----------------------------------------
  secret:
    enabled: false              # prod 改為 true
    name: "sep-engine-secret"

# ========================================
#  4. SEP Cleaner 微服務配置
# ========================================
cleaner:
  replicas: 1
  scanInterval: 10s
  image:
    repository: sep-cleaner
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  # ----------------------------------------
  # 非機密業務參數（可進 git）
  # ----------------------------------------
  env:
    LOG_LEVEL: "info"
    SCAN_INTERVAL: "10s"
    MAX_CLEAN_BATCH: "50"
  secret:
    enabled: false
    name: "sep-cleaner-secret"
